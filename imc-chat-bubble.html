<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMC Assistant Bubble</title>
<style>
  :root {
    --teal-deep: #052b27;
    --orange: #F07B30;
    --gold: #C9A84C;
  }

  /*
    IMPORTANT — WIX EMBED SIZING:
    This file is ONLY the floating bubble. The Wix HTML Embed element
    holding this file should be sized to roughly 70x70px, positioned
    bottom-right. It should NEVER be resized larger — the chat panel
    itself opens in a separate Wix Lightbox (see Velo snippet), so
    this box's hit-area always exactly matches the visible bubble.
    This is what fixes the scroll/click-blocking bug: there is no
    invisible oversized box sitting on the page anymore.
  */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  #imc-fab {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--teal-deep);
    border: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(5,43,39,0.35);
    transition: transform 0.2s ease;
  }
  #imc-fab:hover { transform: scale(1.06); }
  #imc-fab svg { width: 42px; height: 42px; pointer-events: none; }

  .fab-ping {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--orange);
    border: 2px solid white;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div id="imc-fab" role="button" aria-label="Open IMC Assistant chat">
    <svg viewBox="0 0 200 270" xmlns="http://www.w3.org/2000/svg">
      <path d="M100,14 C150,14 172,50 172,88 C172,150 130,205 100,252 C70,205 28,150 28,88 C28,50 50,14 100,14 Z" fill="#052b27" stroke="#C9A84C" stroke-width="6"/>
      <circle cx="100" cy="95" r="52" fill="#f5f2ec"/>
      <circle cx="72" cy="108" r="7" fill="#F07B30" opacity="0.45"/>
      <circle cx="128" cy="108" r="7" fill="#F07B30" opacity="0.45"/>
      <ellipse cx="82" cy="92" rx="6" ry="8" fill="#052b27"/>
      <ellipse cx="118" cy="92" rx="6" ry="8" fill="#052b27"/>
      <circle cx="84" cy="89" r="2" fill="#fff"/>
      <circle cx="120" cy="89" r="2" fill="#fff"/>
      <path d="M84,112 Q100,124 116,112" stroke="#052b27" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g transform="translate(100,175)">
        <circle r="14" fill="#C9A84C"/>
        <path d="M0,-7 L2.1,-2.3 L7,-2 L3.3,1.3 L4.5,6.5 L0,3.7 L-4.5,6.5 L-3.3,1.3 L-7,-2 L-2.1,-2.3 Z" fill="#052b27"/>
      </g>
      <ellipse cx="24" cy="150" rx="12" ry="20" fill="#052b27" transform="rotate(-20 24 150)"/>
      <ellipse cx="176" cy="150" rx="12" ry="20" fill="#052b27" transform="rotate(20 176 150)"/>
    </svg>
    <span class="fab-ping"></span>
  </div>

  <script>
    // Tell the Wix page to open the chat Lightbox.
    // Replace '*' with your exact site URL (e.g. 'https://www.indianmuslimcount.com')
    // once you've confirmed it works — '*' is fine for testing.
    document.getElementById('imc-fab').addEventListener('click', function () {
      window.parent.postMessage({ type: 'imc-chat-open' }, '*');
    });
  </script>

</body>
</html>
