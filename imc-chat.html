<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal:    #052b27;
    --teal-mid:#0a4038;
    --teal-lt: #0d5247;
    --orange:  #F07B30;
    --gold:    #C9A84C;
    --cream:   #f5f0e8;
    --smoke:   #e8e2d8;
    --user-bubble: #052b27;
    --bot-bubble:  #ffffff;
    --radius:  18px;
  }

  html, body {
    height: 100%;
    background: var(--teal);
    font-family: 'DM Sans', sans-serif;
    color: #1a1a1a;
    overscroll-behavior: none;
  }

  /* ── LAYOUT ── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: var(--cream);
    position: relative;
    box-shadow: 0 0 60px rgba(0,0,0,0.4);
  }

  /* ── MASCOT INTRO OVERLAY ── */
  #mascot-intro {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: var(--teal);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #mascot-intro.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .intro-inner svg {
    width: 130px;
    height: auto;
    animation: intro-pop 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  .intro-inner .eye {
    animation: imc-mascot-blink 4.5s infinite;
  }
  .intro-caption {
    margin-top: 16px;
    font-family: 'Playfair Display', serif;
    color: #fff;
    font-size: 15px;
    text-align: center;
    opacity: 0;
    animation: intro-fade-in 0.5s ease forwards 0.35s;
  }
  @keyframes intro-pop {
    0%   { transform: scale(0.4); opacity: 0; }
    60%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes intro-fade-in {
    to { opacity: 1; }
  }

  /* ── IDLE NUDGE ── */
  @keyframes mascot-nudge {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    20% { transform: translateY(-6px) rotate(-4deg); }
    40% { transform: translateY(0) rotate(4deg); }
    60% { transform: translateY(-3px) rotate(-2deg); }
    80% { transform: translateY(0) rotate(0deg); }
  }
  .logo-mark svg.nudging {
    animation: mascot-nudge 0.9s ease-in-out;
  }

  /* ── HEADER ── */
  header {
    background: var(--teal);
    padding: 14px 18px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  .logo-mark {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .logo-mark svg {
    width: 100%;
    height: 100%;
    animation: imc-mascot-float 3s ease-in-out infinite;
  }
  .logo-mark .eye {
    animation: imc-mascot-blink 4.5s infinite;
  }
  @keyframes imc-mascot-float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  @keyframes imc-mascot-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.1); }
  }

  .header-text { flex: 1; min-width: 0; }
  .header-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }
  .header-text p {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    margin-top: 1px;
  }

  .status-dot {
    width: 8px; height: 8px;
    background: #4ade80;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(74,222,128,0.25);
  }

  /* ── MESSAGES ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 0; }

  /* Date divider */
  .date-divider {
    text-align: center;
    font-size: 11px;
    color: #999;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin: 4px 0;
  }

  /* Bubbles */
  .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; }
  .msg.bot  { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 28px; height: 28px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar svg { width: 100%; height: 100%; }

  .bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.55;
    max-width: 100%;
    word-break: break-word;
  }
  .msg.bot  .bubble {
    background: var(--bot-bubble);
    color: #1a1a1a;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .bubble a { color: var(--orange); text-decoration: underline; }
  .bubble strong { font-weight: 600; }
  .bubble em { font-style: italic; color: #555; }

  /* Time stamp */
  .ts {
    font-size: 10.5px;
    color: #aaa;
    margin-top: 2px;
    padding: 0 4px;
    align-self: flex-end;
  }
  .msg.user .ts { text-align: right; }

  /* Typing indicator */
  .typing .bubble {
    display: flex; gap: 5px; align-items: center;
    padding: 12px 16px;
  }
  .dot {
    width: 7px; height: 7px;
    background: #ccc;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); background: var(--orange); }
  }

  /* ── QUICK REPLIES ── */
  #quick-replies {
    padding: 8px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    flex-shrink: 0;
    background: var(--cream);
  }
  .qr-btn {
    background: #fff;
    border: 1.5px solid var(--smoke);
    border-radius: 20px;
    padding: 7px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--teal);
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .qr-btn:hover, .qr-btn:active {
    background: var(--teal);
    color: #fff;
    border-color: var(--teal);
  }

  /* ── INPUT BAR ── */
  #input-area {
    padding: 10px 12px 14px;
    background: #fff;
    border-top: 1px solid var(--smoke);
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }

  #user-input {
    flex: 1;
    border: 1.5px solid var(--smoke);
    border-radius: 22px;
    padding: 10px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14.5px;
    background: var(--cream);
    color: #1a1a1a;
    resize: none;
    max-height: 120px;
    min-height: 44px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.4;
  }
  #user-input:focus { border-color: var(--teal-lt); }
  #user-input::placeholder { color: #aaa; }

  #send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--orange);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }
  #send-btn:hover { background: #d96a20; }
  #send-btn:active { transform: scale(0.94); }
  #send-btn svg { width: 18px; height: 18px; fill: #fff; }
  #send-btn:disabled { background: #ccc; cursor: default; }

  /* ── POWERED BY ── */
  .powered {
    text-align: center;
    font-size: 10.5px;
    color: #bbb;
    padding: 4px 0 2px;
    background: #fff;
    flex-shrink: 0;
    letter-spacing: 0.2px;
  }
  .powered a { color: #bbb; text-decoration: none; }

  /* Scrollbar for desktop */
  @media (min-width: 480px) {
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--smoke); border-radius: 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    .logo-mark svg, .logo-mark .eye { animation: none; }
    .intro-inner svg, .intro-inner .eye, .intro-caption { animation: none; opacity: 1; }
    .logo-mark svg.nudging { animation: none; }
  }
</style>
</head>

ABOUT IMC:
IMC (Integrated Member Community) is a PIN code-based verified community network for members across India. The tagline is "Count Us. Count On Us." Built under the Nine Angle Foundation, founded by Adnan Safee.

MEMBERSHIP TIERS (all free):
1. Community Member (prefix: IMC-COM) — anyone can join, no prerequisites
2. Verified Member — requires an invite code from an existing member
3. Professional Member — for doctors, lawyers, teachers, engineers, etc.
4. Contributor Member — actively contributes to IMC growth
5. PIN Code Pioneer — appointed role, champions IMC at PIN code level
6. Founding Council (FC) — highest tier, founding members, receive Certificate of Honour

All tiers are FREE. IMC runs on community, not capital.

PIN CODES: Every member is linked to their PIN code (postal code), creating hyperlocal community clusters.

KEY LINKS:
- Homepage: https://www.imcbharat.com/imc-home-page
- Join: https://imc-network.imc-wordwide.workers.dev/imc-unified-form.html?tier=observer
- Founding Council: https://imc-network.imc-wordwide.workers.dev/imc-fc-form.html
- Community Map: https://imc-network.imc-wordwide.workers.dev/imc-india-map-fixed.html

GUIDELINES:
- Keep responses to 2-4 lines. Use **bold** for key terms.
- Guide users to the right registration link.
- Do NOT invent statistics or member counts.
- If unsure: "I'll pass this to the IMC team — reach out via the homepage."
- Format links as [text](url).`;

let MASCOT_SVG = MASCOT_VARIANTS.base;

function setMascot(key) {
  const svg = MASCOT_VARIANTS[key] || MASCOT_VARIANTS.base;
  MASCOT_SVG = svg;
  const header = document.getElementById('mascot-header');
  if (header) header.innerHTML = svg;
}

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const IDLE_THRESHOLD = 15000; // 15s of no activity triggers a nudge
let lastActivity = Date.now();

function markActivity() {
  lastActivity = Date.now();
}

function nudgeMascot() {
  const svg = document.querySelector('#mascot-header svg');
  if (!svg) return;
  svg.classList.add('nudging');
  setTimeout(() => svg.classList.remove('nudging'), 900);
}

function checkIdle() {
  if (Date.now() - lastActivity >= IDLE_THRESHOLD) {
    nudgeMascot();
    markActivity(); // reset the clock so it nudges again only after another full idle period
  }
}

function classifyProfession(text) {
  const t = text.toLowerCase();
  if (/doctor|physician|surgeon|dentist|nurse|medical/.test(t)) return 'doctor';
  if (/teacher|professor|educat|lecturer|principal|tutor/.test(t)) return 'educator';
  if (/council|leader|politician|mla|mp|sarpanch|chairman|corporator/.test(t)) return 'leader';
  if (/ngo|volunteer|social work|activist|non.?profit|charity/.test(t)) return 'ngo';
  if (t.trim().length === 0) return 'base';
  return 'professional';
}

// ── LEAD STORAGE (Wix backend) ──
// TODO: replace with your actual Wix functions base URL (same pattern as WIX_BASE used elsewhere)
const WIX_CHAT_BASE = 'https://www.imcbharat.com/_functions';

let currentLeadId = null;
let leadReadyPromise = null;

async function storeLeadInitial(name, phone) {
  try {
    const res = await fetch(`${WIX_CHAT_BASE}/submitChatLead`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone }),
    });
    const data = await res.json();
    currentLeadId = data.id || null;
  } catch (err) {
    console.error('Failed to store chat lead:', err);
  }
}

async function updateLeadProfession(profession) {
  if (leadReadyPromise) await leadReadyPromise; // make sure the initial save landed first
  if (!currentLeadId) return;
  try {
    await fetch(`${WIX_CHAT_BASE}/updateChatLeadProfession`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: currentLeadId, profession }),
    });
  } catch (err) {
    console.error('Failed to update chat lead profession:', err);
  }
}

// ── ONBOARDING FLOW ──
let onboardingStep = 'name'; // 'name' -> 'phone' -> 'profession' -> 'done'
const userProfile = { name: '', phone: '', profession: '' };

function isValidPhone(text) {
  const digits = text.replace(/[^\d]/g, '');
  return digits.length >= 10 && digits.length <= 13;
}

// If arriving from a WhatsApp-originated link, name + phone are already known —
// e.g. https://.../imc-chat.html?source=whatsapp&name=Imran&phone=91XXXXXXXXXX
function initFromChannelParams() {
  const params = new URLSearchParams(window.location.search);
  const source = params.get('source');
  const name = params.get('name');
  const phone = params.get('phone');

  if (source === 'whatsapp' && name && phone) {
    userProfile.name = decodeURIComponent(name).trim().slice(0, 100);
    userProfile.phone = decodeURIComponent(phone).trim().slice(0, 20);
    onboardingStep = 'profession';
    leadReadyPromise = storeLeadInitial(userProfile.name, userProfile.phone); // fire-and-forget, no need to block the greeting
    return true;
  }
  return false;
}

async function handleOnboardingInput(text) {
  if (onboardingStep === 'name') {
    userProfile.name = text.trim();
    onboardingStep = 'phone';
    setTimeout(() => {
      appendMsg('bot', `Nice to meet you, **${userProfile.name}**! 😊\n\nCould you share your phone number? (used only to keep you updated on IMC)`);
    }, 350);
    return;
  }

  if (onboardingStep === 'phone') {
    if (!isValidPhone(text)) {
      setTimeout(() => {
        appendMsg('bot', `That doesn't look like a valid number — could you enter your **10-digit phone number**?`);
      }, 300);
      return;
    }
    userProfile.phone = text.trim();
    onboardingStep = 'profession';
    leadReadyPromise = storeLeadInitial(userProfile.name, userProfile.phone);
    await leadReadyPromise;
    setTimeout(() => {
      appendMsg('bot', `Got it! And lastly — what's your **profession**? (e.g. doctor, teacher, business, NGO/volunteer, council member)`);
    }, 350);
    return;
  }

  if (onboardingStep === 'profession') {
    userProfile.profession = text.trim();
    onboardingStep = 'done';
    const variant = classifyProfession(userProfile.profession);
    setMascot(variant);
    updateLeadProfession(userProfile.profession);

    // Give the AI quiet context about the member without showing it as a message
    conversationHistory.push({
      role: 'user',
      content: `[Profile] Name: ${userProfile.name}, Profession: ${userProfile.profession}. Please greet me by name once and tailor suggestions to my profession where relevant.`
    });

    setTimeout(() => {
      appendMsg('bot', `Wonderful, **${userProfile.name}**! IMC has a place for every profession. What would you like to know about IMC?`);
      setQuickReplies('welcome');
    }, 350);
    return;
  }
}

let conversationHistory = [];
let isTyping = false;


const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('user-input');
const sendBtn    = document.getElementById('send-btn');
const qrEl       = document.getElementById('quick-replies');

function now() {
  return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
}

function renderMarkdown(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[(.+?)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\n/g, '<br>');
}

function appendMsg(role, text) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  if (role === 'bot') {
    const av = document.createElement('div');
    av.className = 'avatar';
    av.innerHTML = MASCOT_SVG;
    wrap.appendChild(av);
  }

  const col = document.createElement('div');
  col.style.display = 'flex';
  col.style.flexDirection = 'column';
  col.style.maxWidth = '100%';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = renderMarkdown(text);

  const ts = document.createElement('div');
  ts.className = 'ts';
  ts.textContent = now();

  col.appendChild(bubble);
  col.appendChild(ts);
  wrap.appendChild(col);
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot typing';
  wrap.id = 'typing-indicator';
  const av = document.createElement('div');
  av.className = 'avatar';
  av.innerHTML = MASCOT_SVG;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  wrap.appendChild(av);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setQuickReplies(set) {
  qrEl.innerHTML = '';
  (QUICK_REPLY_SETS[set] || []).forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = label;
    btn.onclick = () => { markActivity(); sendMessage(label); };
    qrEl.appendChild(btn);
  });
  // Quick replies can grow the footer area and shrink the message list —
  // re-scroll after that layout shift so the last message doesn't get clipped
  requestAnimationFrame(scrollToBottom);
}

async function sendMessage(text) {
  if (isTyping || !text.trim()) return;
  isTyping = true;
  sendBtn.disabled = true;
  qrEl.innerHTML = '';

  appendMsg('user', text);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  // Route through onboarding until name, phone, and profession are collected
  if (onboardingStep !== 'done') {
    await handleOnboardingInput(text);
    isTyping = false;
    sendBtn.disabled = false;
    inputEl.focus();
    return;
  }

  conversationHistory.push({ role: 'user', content: text });
  showTyping();

  try {
    const response = await fetch('https://imc-chat-proxy.imc-wordwide.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversationHistory }),
    });

    const data = await response.json();
    const reply = data.reply || "Sorry, I couldn't get a response. Please try again.";

    hideTyping();
    conversationHistory.push({ role: 'assistant', content: reply });
    appendMsg('bot', reply);

    // Rotate quick replies after first real exchange (accounting for the hidden profile context message)
    if (conversationHistory.length === 3) {
      setQuickReplies('afterJoin');
    }

  } catch (err) {
    hideTyping();
    appendMsg('bot', "Sorry, something went wrong on my end. Please try again — or let me know if there's something else about IMC I can help with.");
    console.error(err);
  }

  isTyping = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

// ── EVENT LISTENERS ──
sendBtn.addEventListener('click', () => { markActivity(); sendMessage(inputEl.value.trim()); });

inputEl.addEventListener('keydown', e => {
  markActivity();
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(inputEl.value.trim());
  }
});

inputEl.addEventListener('input', () => {
  markActivity();
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// ── LANGUAGE TOGGLE ──
let currentLang = 'en';

const QUICK_REPLY_SETS_HI = {
  welcome: ["IMC क्या है?", "Launch कब है?", "Founding Council क्या है?", "Social Media Links"],
  afterJoin: ["क्या यह मुफ़्त है?", "PIN Code क्या है?", "Adnan Safee कौन हैं?", "WhatsApp पर संपर्क करें"],
};

function setQuickRepliesHi(set) {
  qrEl.innerHTML = '';
  (QUICK_REPLY_SETS_HI[set] || []).forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = label;
    btn.onclick = () => { markActivity(); sendMessage(label); };
    qrEl.appendChild(btn);
  });
  requestAnimationFrame(scrollToBottom);
}

function toggleLang() {
  currentLang = currentLang === 'en' ? 'hi' : 'en';
  const btn = document.getElementById('lang-btn');
  if (currentLang === 'hi') {
    btn.textContent = 'EN';
    btn.style.background = 'rgba(240,123,48,0.5)';
    conversationHistory.push({ role: 'user', content: 'अब से हिंदी में जवाब दो।' });
    conversationHistory.push({ role: 'assistant', content: 'ज़रूर! अब मैं हिंदी में जवाब दूंगा।' });
    appendMsg('bot', 'ज़रूर! अब मैं हिंदी में जवाब दूंगा। 😊\n\nआप IMC के बारे में क्या जानना चाहते हैं?');
    setQuickRepliesHi('welcome');
  } else {
    btn.textContent = 'हिं';
    btn.style.background = 'rgba(255,255,255,0.15)';
    conversationHistory.push({ role: 'user', content: 'Please switch back to English.' });
    conversationHistory.push({ role: 'assistant', content: 'Sure! Switching back to English.' });
    appendMsg('bot', 'Switched back to English! How can I help you?');
    setQuickReplies('afterJoin');
  }
}

// Time-based greeting (replaces the old fixed "Assalamu Alaikum" opener)
function getTimeGreeting() {
  const hour = new Date().getHours();
  if (hour < 12) return 'Good Morning';
  if (hour < 17) return 'Good Afternoon';
  return 'Good Evening';
}

// ── WELCOME MESSAGE ──
window.addEventListener('DOMContentLoaded', () => {
  setMascot('base');
  markActivity();

  const cameFromWhatsApp = initFromChannelParams();
  const introEl = document.getElementById('mascot-intro');
  const greeting = getTimeGreeting();

  const welcomeText = cameFromWhatsApp
    ? `${greeting}, **${userProfile.name}**! 👋\n\nGreat to have you here. One quick thing — what's your **profession**? (e.g. doctor, teacher, business, NGO/volunteer, council member)`
    : `${greeting}! 👋\n\nI'm the **IMC Assistant**. Before we begin, what's your **name**?`;

  if (prefersReducedMotion) {
    // Skip the entrance moment entirely for reduced-motion users; go straight to the welcome message
    introEl.classList.add('hide');
    setTimeout(() => appendMsg('bot', welcomeText), 200);
  } else {
    setTimeout(() => introEl.classList.add('hide'), 1300);
    setTimeout(() => appendMsg('bot', welcomeText), 1500);
  }

  if (!prefersReducedMotion) {
    setInterval(checkIdle, 5000);
  }
});
